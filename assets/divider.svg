<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 50" width="1000" height="50" role="img" aria-label="decorative divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3de"/>
      <stop offset="0.5" stop-color="#c8a2ff"/>
      <stop offset="1" stop-color="#9be7ff"/>
    </linearGradient>
    <path id="star" d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5Z"/>
    <path id="heart" d="M0,3 C-8,-5 -10,-11 -5,-11 C-2,-11 0,-9 0,-6 C0,-9 2,-11 5,-11 C10,-11 8,-5 0,3Z"/>
  </defs>
  <rect x="40" y="23" width="400" height="4" rx="2" fill="url(#line)"/>
  <rect x="560" y="23" width="400" height="4" rx="2" fill="url(#line)"/>
  <g transform="translate(455,25)"><use href="#star" fill="#c8a2ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></use></g>
  <g transform="translate(500,26)"><use href="#heart" fill="#ff5fb0"><animateTransform attributeName="transform" type="scale" values="1;1.35;1" dur="1.4s" repeatCount="indefinite"/></use></g>
  <g transform="translate(545,25)"><use href="#star" fill="#9be7ff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></use></g>
  <g transform="translate(240,25) scale(0.6)"><use href="#star" fill="#ff8fd0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></use></g>
  <g transform="translate(760,25) scale(0.6)"><use href="#star" fill="#ff8fd0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></use></g>
</svg>

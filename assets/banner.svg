<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Hi, I'm Mahira - from art to code" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3de"/>
      <stop offset="0.5" stop-color="#e0c3ff"/>
      <stop offset="1" stop-color="#b8ecff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fb0"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd6ee"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="check" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <rect x="20" y="20" width="20" height="20" fill="#ffffff"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="320" rx="24"/></clipPath>
    <path id="star" d="M0,-14 L3.5,-3.5 L14,0 L3.5,3.5 L0,14 L-3.5,3.5 L-14,0 L-3.5,-3.5Z"/>
    <path id="heart" d="M0,4 C-10,-6 -12,-14 -6,-14 C-3,-14 0,-11 0,-8 C0,-11 3,-14 6,-14 C12,-14 10,-6 0,4Z"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#check)" opacity="0.22"/>

    <!-- retro window: hard shadow, frame, title bar -->
    <rect x="102" y="52" width="820" height="240" rx="14" fill="#b98cff" opacity="0.65"/>
    <rect x="90" y="40" width="820" height="240" rx="14" fill="#fff7fc" stroke="#ffffff" stroke-width="4"/>
    <rect x="90" y="40" width="820" height="40" rx="14" fill="url(#bar)"/>
    <rect x="90" y="62" width="820" height="18" fill="url(#bar)"/>
    <use href="#star" x="122" y="60" fill="#ffffff" transform="translate(0,0) scale(0.9)" style="transform-origin:122px 60px"/>
    <text x="146" y="67" font-family="'Trebuchet MS','Verdana',sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">mahira.exe</text>

    <!-- window buttons -->
    <g fill="#ffffff" stroke="#ff5fb0" stroke-width="2">
      <rect x="800" y="48" width="26" height="24" rx="5"/>
      <rect x="832" y="48" width="26" height="24" rx="5"/>
      <rect x="864" y="48" width="26" height="24" rx="5"/>
    </g>
    <g stroke="#ff5fb0" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="806" y1="65" x2="820" y2="65"/>
      <rect x="839" y="55" width="12" height="10" stroke-width="2"/>
      <line x1="871" y1="55" x2="883" y2="66"/>
      <line x1="883" y1="55" x2="871" y2="66"/>
    </g>

    <!-- content -->
    <text x="503" y="173" text-anchor="middle" font-family="'Trebuchet MS','Verdana',sans-serif" font-size="66" font-weight="800" font-style="italic" fill="#ffd0ea">Hi, I'm Mahira</text>
    <text x="500" y="170" text-anchor="middle" font-family="'Trebuchet MS','Verdana',sans-serif" font-size="66" font-weight="800" font-style="italic" fill="url(#bar)">Hi, I'm Mahira</text>
    <text x="500" y="212" text-anchor="middle" font-family="'Trebuchet MS','Verdana',sans-serif" font-size="26" font-weight="600" fill="#9b6bd6" letter-spacing="5">from art to code</text>
    <use href="#heart" x="305" y="207" fill="#ff5fb0"/>
    <use href="#heart" x="695" y="207" fill="#ff5fb0"/>

    <!-- chrome pill -->
    <rect x="290" y="232" width="420" height="34" rx="17" fill="url(#chrome)" stroke="#ff8fd0" stroke-width="2"/>
    <text x="500" y="255" text-anchor="middle" font-family="'Trebuchet MS','Verdana',sans-serif" font-size="15" font-weight="700" fill="#d63384" letter-spacing="1">software dev  ·  La Plateforme_  ·  Marseille</text>

    <!-- twinkling sparkles -->
    <g fill="#ffffff">
      <g transform="translate(42,62)"><use href="#star"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></use></g>
      <g transform="translate(958,88)"><use href="#star" fill="#ff5fb0"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></use></g>
      <g transform="translate(55,250)"><use href="#star" fill="#b98cff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></use></g>
      <g transform="translate(948,262)"><use href="#star"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></use></g>
      <g transform="translate(500,22)"><use href="#star" fill="#ff5fb0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></use></g>
      <g transform="translate(150,135) scale(0.7)"><use href="#star" fill="#ffb3de"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" begin="0.4s" repeatCount="indefinite"/></use></g>
      <g transform="translate(850,140) scale(0.7)"><use href="#star" fill="#b8ecff"><animate attributeName="opacity" values="1;0.1;1" dur="2.3s" repeatCount="indefinite"/></use></g>
      <g transform="translate(175,225) scale(0.6)"><use href="#star" fill="#e0c3ff"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0.2s" repeatCount="indefinite"/></use></g>
      <g transform="translate(830,228) scale(0.6)"><use href="#star" fill="#ffb3de"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" begin="0.9s" repeatCount="indefinite"/></use></g>
    </g>

    <!-- floating hearts -->
    <g fill="#ff5fb0">
      <use href="#heart" x="30" y="0" opacity="0.8"><animateTransform attributeName="transform" type="translate" from="0 330" to="0 -20" dur="6s" repeatCount="indefinite"/></use>
      <use href="#heart" x="972" y="0" opacity="0.8"><animateTransform attributeName="transform" type="translate" from="0 330" to="0 -20" dur="7s" begin="1.5s" repeatCount="indefinite"/></use>
      <use href="#heart" x="70" y="0" fill="#b98cff" opacity="0.7"><animateTransform attributeName="transform" type="translate" from="0 330" to="0 -20" dur="8s" begin="3s" repeatCount="indefinite"/></use>
      <use href="#heart" x="935" y="0" fill="#ffffff" opacity="0.9"><animateTransform attributeName="transform" type="translate" from="0 330" to="0 -20" dur="6.5s" begin="4s" repeatCount="indefinite"/></use>
    </g>

    <!-- holographic shimmer sweep -->
    <rect x="-200" y="-20" width="140" height="360" fill="url(#shine)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" additive="sum" from="-200 0" to="1300 0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
